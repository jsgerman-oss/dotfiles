"$schema" = 'https://starship.rs/config-schema.json'

# ─── One-line powerline prompt ──────────────────────────────────
# Every module is a self-contained colored "pill" (rounded nerd-font
# caps  ) wrapped in a starship conditional ( … ) group. When a
# module has nothing to show, the whole pill — caps included — is not
# rendered, so the prompt collapses/expands cleanly with context.
# No connected-arrow seams to break when a middle segment hides.
#
# Layout (left, single line):
#    host?   dir   git   k8s   azure   lang   took   🐳   ❯
# Right side:  battery   time
format = "$hostname$directory$git_branch$git_status$kubernetes$azure$python$nodejs$golang$terraform$cmd_duration${custom.colima}$character"
right_format = "$battery$time"

add_newline = false
palette = "cobalt"

# ─── Palette ────────────────────────────────────────────────────
[palettes.cobalt]
cobalt  = "#2D5BFF"
magenta = "#FF1FE7"
grey    = "#6b7280"
fg      = "#e0e0ee"
amber   = "#F59E0B"
red     = "#FF4D4D"
green   = "#22EE99"
cyan    = "#22D3EE"
purple  = "#c0a3ff"
ink     = "#10101a"   # dark text for bright pills

# ─── Prompt character ───────────────────────────────────────────
[character]
success_symbol = "[❯](bold cobalt)"
error_symbol   = "[✗❯](bold magenta)"
vimcmd_symbol  = "[❮](bold green)"

# ─── Hostname pill (SSH only, leads the line) ───────────────────
[hostname]
ssh_only = true
format   = "([](fg:red)[ 󰢩 $hostname ](fg:ink bg:red)[](fg:red) )"

# ─── Directory pill (always shown, cobalt) ──────────────────────
[directory]
format            = "[](fg:cobalt)[ $path$read_only](fg:fg bg:cobalt)[](fg:cobalt) "
read_only         = " "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo  = true

[directory.substitutions]
"~/Documents/GitHub" = " gh"
"~/work"             = " work"
"~/Code"             = " code"

# ─── Git pills (magenta) ────────────────────────────────────────
[git_branch]
symbol = " "
format = "([](fg:magenta)[ $symbol$branch ](fg:ink bg:magenta)[](fg:magenta) )"

[git_status]
format     = "([](fg:magenta)[ $all_status$ahead_behind](fg:ink bg:magenta)[](fg:magenta) )"
conflicted = "✖ "
ahead      = "⇡${count} "
behind     = "⇣${count} "
diverged   = "⇕⇡${ahead_count}⇣${behind_count} "
untracked  = "?${count} "
stashed    = "\\$${count} "
modified   = "!${count} "
staged     = "+${count} "
renamed    = "»${count} "
deleted    = "✘${count} "

# ─── Kubernetes pill (cyan) ─────────────────────────────────────
[kubernetes]
disabled     = false
symbol       = "⎈ "
format       = "([](fg:cyan)[ $symbol$context( \\($namespace\\)) ](fg:ink bg:cyan)[](fg:cyan) )"
detect_files = ["k8s", "Chart.yaml"]
[kubernetes.context_aliases]
"arn:aws:eks:.*:.*:cluster/(?P<cluster>[\\w-]+)" = "$cluster"

# ─── Azure pill (purple) ────────────────────────────────────────
[azure]
disabled = false
symbol   = "󰠅 "
format   = "([](fg:purple)[ $symbol$subscription ](fg:ink bg:purple)[](fg:purple) )"

# ─── Python pill (green) ────────────────────────────────────────
[python]
symbol            = " "
format            = "([](fg:green)[ $symbol$pyenv_prefix($version)( \\($virtualenv\\)) ](fg:ink bg:green)[](fg:green) )"
detect_extensions = ["py"]
detect_files      = ["pyproject.toml", "requirements.txt", "Pipfile", ".python-version"]

# ─── Node pill (green) ──────────────────────────────────────────
[nodejs]
disabled     = false
symbol       = " "
format       = "([](fg:green)[ $symbol$version ](fg:ink bg:green)[](fg:green) )"
detect_files = ["package.json", ".node-version", ".nvmrc"]

# ─── Go pill (cyan) ─────────────────────────────────────────────
[golang]
disabled = false
symbol   = " "
format   = "([](fg:cyan)[ $symbol$version ](fg:ink bg:cyan)[](fg:cyan) )"

# ─── Terraform pill (purple) ────────────────────────────────────
[terraform]
disabled = false
symbol   = "󱁢 "
format   = "([](fg:purple)[ $symbol$workspace ](fg:ink bg:purple)[](fg:purple) )"

# ─── Command duration pill (amber) ──────────────────────────────
[cmd_duration]
min_time          = 2_000
format            = "([](fg:amber)[ $duration ](fg:ink bg:amber)[](fg:amber) )"
show_milliseconds = false

# ─── Colima/Docker accent (🐳 when the VM is up) ────────────────
# A stat() on the docker socket — microseconds, never slows the prompt.
[custom.colima]
description    = "Show 🐳 when colima VM is running"
when           = "test -S $HOME/.colima/default/docker.sock"
command        = "echo 🐳"
format         = "[ $output ](bold green)"
ignore_timeout = true

# ─── Battery (right side, color-coded text) ─────────────────────
[battery]
format             = "[ $symbol$percentage]($style)"
full_symbol        = "󰁹 "
charging_symbol    = "󰂄 "
discharging_symbol = "󰂃 "
[[battery.display]]
threshold = 20
style     = "bold red"
[[battery.display]]
threshold = 50
style     = "amber"
[[battery.display]]
threshold = 100
style     = "grey"

# ─── Time pill (right side, grey) ───────────────────────────────
[time]
disabled    = false
format      = "[](fg:grey)[ $time ](fg:fg bg:grey)[](fg:grey)"
time_format = "%H:%M"

# ─── Disabled / situational modules ─────────────────────────────
[username]
show_always = false
[aws]
disabled = true
[gcloud]
disabled = true
[docker_context]
disabled = true
[package]
disabled = true
[line_break]
disabled = true
